<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Exploration Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
    <video autoplay muted loop id="myVideo">
        <source src="video.mp4" type="video/mp4">
      </video>
    <div class="navbar">
        <div class="logo">SPACED</div>
        <i class="fa-solid fa-bars" id="hide"></i>
        <div class="navlist">
            <a href="#" >Destination</a>
            <a href="#" >Experience</a>
            <a href="#" >Sign In</a>
            <a href="#" >Join</a>
        </div>
    </div>
    <div class="hero-section">
        <h1>TO SPACE AND BACK SAFELY</h1>
        <div class="book-section">
         <div class="book-trip">
            <div class="from dropdown">
            <p>From</p>
            <select>
                <option selected>Earth</option>
                <option>Moon</option>
                <option>Sun</option>
            </select>
          </div>

          <div class="to dropdown">
            <p>To</p>
            <select>
                <option>Earth</option>
                <option selected>Moon</option>
                <option>Sun</option>
            </select>
        </div>

            <div class="travelers dropdown">
                <p>Travelers</p>
                <select>
                    <option>1 Adult</option>
                    <option selected>2 Adults</option>
                    <option>3 Adults</option>
                </select>
              </div>
            </div>

              <button class="book-btn">BOOK</button>
    </div>
</div>
    <div class="footer">
        <div class="discount">
        <h4>NEW DISCOUNT</h4>
        <p>To moon and back for $888!!!</p>
        </div>
        
        <div class="watch">
           <div class="icon"><i class="fa-solid fa-play"></i></div>
           <p>Watch and dive in the Universe!</p>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
